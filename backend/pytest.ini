[pytest]
testpaths = tests
filterwarnings =
    # python-multipart's legacy `import multipart` shim emits a PendingDeprecationWarning
    # under older starlette that still imports `multipart`. It's harmless (form parsing is
    # not used), so silence exactly this third-party shim warning (issue #17).
    ignore:Please use `import python_multipart` instead.*:PendingDeprecationWarning